<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artha — AI Wealth Advisor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222;
      --border: #2e2e2e;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #4f8ef7;
      --user-bubble: #1d2d4a;
      --bot-bubble: #1e1e1e;
      --input-bg: #1a1a1a;
      --sidebar-w: 260px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    #sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header h1 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    #sidebar-header p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    #portfolio-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      padding: 14px 16px 8px;
    }

    .portfolio-btn {
      display: flex;
      flex-direction: column;
      padding: 10px 16px;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text);
      text-align: left;
      width: 100%;
      border-radius: 6px;
      margin: 1px 8px;
      width: calc(100% - 16px);
      transition: background 0.15s;
    }

    .portfolio-btn:hover { background: var(--surface2); }
    .portfolio-btn.active { background: var(--user-bubble); }

    .portfolio-btn .name { font-size: 13px; font-weight: 500; }
    .portfolio-btn .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    #new-chat-btn {
      margin: auto 12px 16px;
      padding: 10px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    #new-chat-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Main chat area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #chat-header .dot {
      width: 8px; height: 8px;
      background: #4caf50;
      border-radius: 50%;
    }

    #chat-header .title { font-size: 14px; font-weight: 500; }
    #chat-header .subtitle { font-size: 12px; color: var(--muted); margin-left: auto; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .message-row {
      padding: 10px 20px;
      display: flex;
      gap: 12px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      margin-top: 2px;
    }

    .avatar.bot { background: var(--accent); color: white; }
    .avatar.user { background: #444; color: var(--text); }

    .bubble {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      flex: 1;
      padding-top: 4px;
    }

    .bubble.typing::after {
      content: '▍';
      animation: blink 1s step-end infinite;
      opacity: 0.7;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .bubble pre {
      background: #111;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12.5px;
      overflow-x: auto;
      margin: 10px 0;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .bubble strong { color: #fff; }

    /* Empty state */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      padding: 40px;
      text-align: center;
    }

    #empty-state .icon { font-size: 36px; margin-bottom: 8px; }
    #empty-state h2 { font-size: 18px; color: var(--text); font-weight: 500; }
    #empty-state p { font-size: 13px; max-width: 340px; }

    .suggestion-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }

    .pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 12.5px;
      cursor: pointer;
      color: var(--text);
      transition: all 0.15s;
    }
    .pill:hover { border-color: var(--accent); color: var(--accent); }

    /* Input area */
    #input-area {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    #input-wrap {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      transition: border-color 0.15s;
    }

    #input-wrap:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      resize: none;
      max-height: 150px;
      font-family: inherit;
      line-height: 1.5;
    }

    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #send-btn svg { width: 16px; height: 16px; fill: white; }

    #input-hint {
      max-width: 800px;
      margin: 6px auto 0;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>Artha ✦</h1>
    <p>AI Wealth Advisor</p>
  </div>
  <div id="portfolio-label">Portfolios</div>
  <div id="portfolio-list"></div>
  <button id="new-chat-btn" onclick="newChat()">+ New conversation</button>
</div>

<div id="main">
  <div id="chat-header">
    <div class="dot"></div>
    <div class="title" id="header-title">Select a portfolio to begin</div>
    <div class="subtitle" id="header-subtitle"></div>
  </div>

  <div id="messages">
    <div id="empty-state">
      <div class="icon">📊</div>
      <h2>Good morning, investor</h2>
      <p>Select a portfolio on the left, or ask me anything about markets and investing.</p>
      <div class="suggestion-pills">
        <button class="pill" onclick="sendSuggestion(this)">How is the market today?</button>
        <button class="pill" onclick="sendSuggestion(this)">What are the biggest sector movers?</button>
        <button class="pill" onclick="sendSuggestion(this)">Explain concentration risk</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-wrap">
      <textarea id="user-input" rows="1" placeholder="Ask about your portfolio, markets, or anything investing…"></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div id="input-hint">Press Enter to send · Shift+Enter for new line</div>
  </div>
</div>

<script>
  const SESSION_ID = 'session_' + Math.random().toString(36).slice(2, 9);
  let activePortfolioId = null;
  let isStreaming = false;

  // ── Bootstrap ──────────────────────────────────────────────────
  async function loadPortfolios() {
    const res = await fetch('/api/portfolios');
    const portfolios = await res.json();
    const list = document.getElementById('portfolio-list');
    list.innerHTML = '';
    portfolios.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'portfolio-btn';
      const sign = p.gainLossPercent >= 0 ? '+' : '';
      btn.innerHTML = `
        <span class="name">${p.name.split(' ').slice(0, 2).join(' ')}</span>
        <span class="meta">${p.type} · ${sign}${p.gainLossPercent.toFixed(2)}%</span>
      `;
      btn.onclick = () => selectPortfolio(p.id, p.name, btn);
      list.appendChild(btn);
    });
  }

  function selectPortfolio(id, name, btn) {
    document.querySelectorAll('.portfolio-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activePortfolioId = id;
    document.getElementById('header-title').textContent = name;
    document.getElementById('header-subtitle').textContent = 'Portfolio analysis active';
    hideEmptyState();
    appendBotMessage(`Analyzing **${name}'s portfolio**… give me a moment.`);
    sendMessage(`Analyze the portfolio for ${id} and give me a quick briefing on today's performance.`);
  }

  // ── Messaging ──────────────────────────────────────────────────
  function hideEmptyState() {
    const es = document.getElementById('empty-state');
    if (es) es.remove();
  }

  function appendUserMessage(text) {
    hideEmptyState();
    const row = document.createElement('div');
    row.className = 'message-row';
    row.innerHTML = `
      <div class="avatar user">U</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    document.getElementById('messages').appendChild(row);
    scrollToBottom();
  }

  function appendBotMessage(text = '') {
    hideEmptyState();
    const row = document.createElement('div');
    row.className = 'message-row';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = renderMarkdown(text);
    row.innerHTML = `<div class="avatar bot">A</div>`;
    row.appendChild(bubble);
    document.getElementById('messages').appendChild(row);
    scrollToBottom();
    return bubble;
  }

  async function sendMessage(overrideText) {
    if (isStreaming) return;
    const input = document.getElementById('user-input');
    const text = overrideText || input.value.trim();
    if (!text) return;

    if (!overrideText) {
      input.value = '';
      input.style.height = 'auto';
      appendUserMessage(text);
    }

    isStreaming = true;
    document.getElementById('send-btn').disabled = true;

    const bubble = appendBotMessage('');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, portfolioId: activePortfolioId, sessionId: SESSION_ID }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));
            if (data.token) {
              fullText += data.token;
              bubble.innerHTML = renderMarkdown(fullText);
              scrollToBottom();
            }
            if (data.done || data.error) {
              bubble.classList.remove('typing');
            }
          } catch {}
        }
      }
    } catch (err) {
      bubble.innerHTML = `Sorry, something went wrong: ${escapeHtml(err.message)}`;
      bubble.classList.remove('typing');
    }

    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
  }

  function sendSuggestion(btn) {
    const text = btn.textContent;
    hideEmptyState();
    appendUserMessage(text);
    sendMessage(text);
  }

  async function newChat() {
    await fetch('/api/chat/clear', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: SESSION_ID }),
    });
    document.getElementById('messages').innerHTML = `
      <div id="empty-state">
        <div class="icon">📊</div>
        <h2>Good morning, investor</h2>
        <p>Select a portfolio on the left, or ask me anything about markets and investing.</p>
        <div class="suggestion-pills">
          <button class="pill" onclick="sendSuggestion(this)">How is the market today?</button>
          <button class="pill" onclick="sendSuggestion(this)">What are the biggest sector movers?</button>
          <button class="pill" onclick="sendSuggestion(this)">Explain concentration risk</button>
        </div>
      </div>`;
    document.querySelectorAll('.portfolio-btn').forEach(b => b.classList.remove('active'));
    activePortfolioId = null;
    document.getElementById('header-title').textContent = 'Select a portfolio to begin';
    document.getElementById('header-subtitle').textContent = '';
  }

  // ── Utilities ──────────────────────────────────────────────────
  function scrollToBottom() {
    const el = document.getElementById('messages');
    el.scrollTop = el.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMarkdown(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }

  // Auto-resize textarea
  document.getElementById('user-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 150) + 'px';
  });

  document.getElementById('user-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  loadPortfolios();
</script>
</body>
</html>
